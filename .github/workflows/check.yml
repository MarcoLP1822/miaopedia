name: Check Miaopedia
on:
  pull_request:
    paths:
      - 'dist/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/check.yml'
  push:
    branches: [design/kawaii-album]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: npm ci
      - run: npm run check
      - run: npm test
